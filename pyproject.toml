[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
[project]
name = "deltaleague-cli"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["httpx>=0.28,<1", "typer>=0.16,<1", "safetensors>=0.5,<1", "torch>=2.6"]
[project.optional-dependencies]
local = ["transformers==5.22.1", "math-verify==0.9.0"]
ifeval = ["lm-eval>=0.4.9,<0.5"]

[project.scripts]
delta = "delta_cli.main:app"
[tool.setuptools.packages.find]
include = ["delta_cli*"]
