name: Build and publish Python package
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the checked package to PyPI
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build and test dependencies
        run: |
          python -m pip install --upgrade pip build twine pytest
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install '.[local]'
      - name: Test and build
        run: |
          python -m pytest -q tests
          python -m build
          python -m twine check --strict dist/*
      - name: Check installed wheel
        run: |
          python -m pip install --force-reinstall --no-deps dist/*.whl
          cd /tmp
          delta --help
          delta run --help
          delta evaluate --help
      - uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist/*
          if-no-files-found: error
  publish:
    if: inputs.publish && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/deltaleague/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist/
      - name: Publish to PyPI using Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1
